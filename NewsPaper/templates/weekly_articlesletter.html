<!DOCTYPE html>
<html>
<head>
    <title>Weekly articles selection</title>
</head>
<body>
    <h1>Hello, {{ username }}!</h1>
    <p>Here are the new articles in category "{{ category.name }}" from the past week (from {{ week_ago|date:"d.m.Y" }}):</p>

    {% for post in posts %}
    <div style="margin-bottom: 20px; padding: 10px; border: 1px solid #ddd;">
        <h2>{{ post.title }}</h2>
        <p><strong>Date:</strong> {{ post.creation_date|date:"d.m.Y H:i" }}</p>
        <p>{{ post.text|truncatewords:50 }}</p>
        <a href="{{ post.get_absolute_url_with_domain }}">Read full</a>
    </div>
    </div>
    {% endfor %}
</body>
</html>
