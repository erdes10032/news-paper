<!-- post_created.html -->
<!DOCTYPE html>
<html>
<head>
    <title>New Post</title>
</head>
<body>
    <h1>Hello, {{ username }}!</h1>
    <p>New article in your favorite section!</p>
    <h2>{{ post.title }}</h2>
    <p>{{ post.text|truncatewords:50 }}</p>
    <a href="{{ post.get_absolute_url_with_domain }}">Read full</a>
</body>
</html>
